<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Link to the react library from unpkg.com -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Link to the babel library from unpkg.com -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Import bootstrap from cdn -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <!-- Important React concepts: Components, Props, State -->
    <!-- https://www.cdn.miami.edu/_assets-common/php/searchblox/? -->
    <div id="app" class="container"></div>
    <script type="text/babel">
      
        const app = document.getElementById("app");
        // React Components
        function Header({ title }) {
            return <h1> {createTitle(title)} </h1>;
        }
        function Paragraph(props) {
            return <p> {props.text} </p>;
        }
        function createTitle(title) {
            if (title) {
                return title;
            }
                else { 
                return  "Default title";
            }
        }
        function formatHtml(text) {
            //Formats html from a json api object
            return text;
        }

        function Results({ result, totalResults, currentPage, lastPage, getNextPage, getPreviousPage }) {
            return (
                <div>
                    {result.length > 0 && <h2>Search Results:</h2>}
                    <div className="mt-3 mb-1">
                    <Paragraph text={`Showing Page ${currentPage} of ${lastPage}`} />
                    </div>
                    <div className="mt-0">
                    <Paragraph text={`Total Results: ${totalResults}`} />
                    </div>

                    <table className="table table-striped">
                        <tbody>
                             {result.map((res, index) => (
                                <tr key={res.uid}>
                                    <td>
                                        <strong>{res.alpha}</strong> <br />
                                        {formatHtml(res.context)} <br />
                                        <a href={res.url} target="_blank">
                                             View
                                         </a>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                    <button className="btn btn-secondary me-2" onClick={getPreviousPage} disabled={currentPage === 1}>
                        Previous Page
                    </button>
                    <button className="btn btn-secondary" onClick={getNextPage} disabled={currentPage === lastPage}>
                        Next Page
                        </button>
                </div>
            );
        }

        function Homepage() {
            //react state
            const [totalResults, setTotalResults] = React.useState(0);
            const [currentPage, setCurrentPage] = React.useState(1);
            const [lastPage, setLastPage] = React.useState(1);

            // Search application
            const [searchTerm, setSearchTerm] = React.useState("");

            // track results
            const [searchResults, setSearchResults] = React.useState([]);

            function performSearch(pageNumber = 1) {
                const searchUrl = `https://www.cdn.miami.edu/_assets-common/php/searchblox/?q=${searchTerm}&page=${pageNumber}`;
                fetch(searchUrl)
                    .then((response) => response.json())
                    .then((data) => {
                        console.log("Search results: ", data);
                        setSearchResults(data.result);
                        setTotalResults(data.hits);
                        setCurrentPage(data.currentPage);
                        setLastPage(data.lastPage);
                        // data.hits - total number of results
                        // data.currentPage - current page number
                        // data.lastPage
                        // You can also update the state with the search results here 

                    })      
                    .catch(error => {
                        console.error("Error fetching search results: ", error);
                    });
            }

            function handleSearch() {
                setCurrentPage(1);
                setLastPage(1);
                performSearch(1);
            }

            function getNextPage() {
                if (currentPage < lastPage) {
                    const nextPage = currentPage + 1;
                    performSearch(nextPage);
                }
            }

            function getPreviousPage() {
                if (currentPage > 1) {
                    const previousPage = currentPage - 1;
                    performSearch(previousPage);
                }
            }

            return (
             <>
                <Header title="Welcome to the search page" />
                <Paragraph text="Enter a search term below." />
                <div className="mb-3">
                    <label className="form-label" htmlFor="search">
                     Search:
                     </label>
                    <input 
                        className="form-control"
                        type="text"
                        id="search"
                        name="search"
                        placeholder="Search miami.edu..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                />
                </div>
            
                <button className="btn btn-primary" onClick={handleSearch}>Search</button>
                <Results result={searchResults}
                         totalResults={totalResults} 
                         currentPage={currentPage} 
                         lastPage={lastPage} 
                         getNextPage={getNextPage} 
                         getPreviousPage={getPreviousPage}
                 />
                </>
            );
        }


        const root = ReactDOM.createRoot(app);
        root.render(<Homepage />);
    </script> 
</body>
</html>
